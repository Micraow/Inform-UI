<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Intelligent-UI 浏览器示例</title>
<link id="iui-style" rel="stylesheet" href="https://cdn.jsdelivr.net/gh/Micraow/Intelligent-UI@95bb0f2adccfd1f68db92dd38a17a6c89148ebd8/cdn/iui.css" integrity="sha384-WnXEt8agh2ZXeEhfBtTnHQsYGmAt/wX2Vh71toJzflgPssB1I/G8s2z4VPi4nuaD" crossorigin="anonymous">
</head>
<body>
<main id="answer"></main>
<pre id="status" role="alert"></pre>
<script id="spec" type="application/json">{
  "version": "iui/1",
  "title": "数学字体与排版",
  "description": "原创公式回归示例，用于检查数学字形、上下标、积分、伸缩括号及无障碍 MathML。",
  "body": [
    {
      "type": "title",
      "value": "让公式保留数学字形"
    },
    {
      "type": "caption",
      "value": "此页使用明确许可的 KaTeX 数学字体。公式内容不依赖远程服务。"
    },
    {
      "type": "math",
      "id": "sets",
      "latex": "A_1 \\subseteq A_1 \\cup A_2 \\Rightarrow f(A_1) \\subseteq f(A_1 \\cup A_2)"
    },
    {
      "type": "math",
      "id": "inline",
      "block": false,
      "latex": "R_1 + \\alpha + \\beta + \\Gamma = \\mathbb{R}"
    },
    {
      "type": "math",
      "id": "integral",
      "latex": "\\int_0^1 x^2\\,\\mathrm{d}x = \\frac{1}{3}"
    },
    {
      "type": "math",
      "id": "braces",
      "latex": "\\left\\{\\begin{aligned} x+y\u0026=3\\\\ x-y\u0026=1 \\end{aligned}\\right."
    },
    {
      "type": "math",
      "id": "variants",
      "latex": "\\mathbf{R}\\;\\mathit{R}\\;\\boldsymbol{\\alpha}\\;\\mathcal{F}\\;\\mathfrak{g}\\;\\mathsf{R}\\;\\mathtt{R}"
    },
    {
      "type": "caption",
      "value": "公式保留原始 LaTeX 注释。窄屏只在公式区域内滚动，正文不横向溢出。"
    }
  ]
}</script>
<script src="https://cdn.jsdelivr.net/gh/Micraow/Intelligent-UI@95bb0f2adccfd1f68db92dd38a17a6c89148ebd8/cdn/iui.global.min.js" integrity="sha384-TFjBiCHoXGNRCByDYBY6XFhOH947MPPBDx4MuISbZ/LDo/ZnmzwCHLxVWj6vXG/G" crossorigin="anonymous"></script>
<script>
  const target = document.getElementById('answer');
  const status = document.getElementById('status');
  try {
    if (!window.IUI) throw new Error('界面库加载失败，请检查网络或固定版本的 CDN 链接。');
    if (!document.getElementById('iui-style').sheet) throw new Error('样式加载失败，请检查 CDN 链接。');
    const result = IUI.validateDocument(JSON.parse(document.getElementById('spec').textContent));
    if (!result.ok) status.textContent = result.issues.map(i => i.code + ' ' + i.path + ': ' + i.message).join('\n');
    else IUI.mount(target, result.document, { styles: false });
  } catch (error) {
    status.textContent = error instanceof Error ? error.message : String(error);
  }
</script>
</body>
</html>
