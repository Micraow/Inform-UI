name: JS-only portable UI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - id: check
        run: npm run check
      - run: npm audit --omit=dev
      - run: node scripts/check-generated.mjs
      - run: npx playwright install --with-deps chromium
      - name: Install CJK test font with bounded network retries
        timeout-minutes: 4
        run: sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y --no-install-recommends fonts-noto-cjk
      - run: npm run test:browser
      - name: Verify original Skill consumer examples in Chromium
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: node tests/consumer/scripts/verify-next-browser.mjs --library "$PWD" --revision "$(git rev-parse HEAD)" --screenshots "$PWD/test-results/skill-consumer"
      - name: Verify loading and source consumers in Chromium
        if: ${{ !cancelled() && steps.check.outcome == 'success' }}
        run: node tests/consumer/scripts/verify-next66-browser.mjs --library "$PWD" --revision "$(git rev-parse HEAD)" --screenshots "$PWD/test-results/skill-consumer-66"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-ui-browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
