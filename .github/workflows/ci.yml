# Current HEAD portability. Full Node, showcase and browser gates run in recovery-validation.yml.
name: JS-only portable UI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  portability:
    name: Portability Node ${{ matrix.node }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 22 }
          - { os: macos-latest, node: 22 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: library
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: library/package-lock.json
      - name: Build matched library on the actual platform
        working-directory: library
        run: |
          npm ci --ignore-scripts
          npm run build
      - name: Exercise platform-specific packaging and CLI paths
        working-directory: library
        shell: bash
        run: node scripts/verify-platform-smoke.mjs --library "$PWD" --revision "$(git rev-parse HEAD)" --report artifacts/platform-smoke.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: platform-${{ matrix.os }}-node-${{ matrix.node }}
          path: library/artifacts/platform-smoke.json
          retention-days: 7
